; DOOM VR 1.1-dev1 - Neural Post. Guardar como UTF-8.
; Ubicacion: junto a KharvoxLayer.dll, en la carpeta del mod.
; Se lee UNA VEZ al iniciar el juego: cierra DOOM, edita, guarda y vuelve a abrir.
; No cambia en caliente. Remleo es externo: Carlos lo instala/configura aparte.
; Orden: DLAA/DLSS/foveado -> Neural -> entrega OpenXR -> Remleo -> visor.
; La opcion Neural antigua del panel B3 permanece bloqueada: esta ruta usa este INI.
; Si falta el INI, Neural queda apagado. Un valor invalido desactiva esta ruta,
; conserva la imagen original y registra el motivo en el log KHARVOX.
; Numeros con punto decimal, booleanos 0/1; comentarios en lineas separadas.
; No duplicar claves ni anadir claves inventadas dentro de [Neural].
; Procesa escenas estereo validas, se suspende en menus/cinematicas.
; HUD separado queda fuera; manos, armas o texto integrados en escena pueden cambiar.
; Es una integracion experimental privada del modelo local, no soporte oficial.

[Neural]
Schema=1

; 0=apagado, 1=activado. Para recuperar la imagen original: 0 y reiniciar DOOM.
; Entrega experimental preparada para probar el efecto: activado.
Enabled=1

; Resolucion de trabajo del modelo, % POR DIMENSION: entero 25..100.
; No cambia resolucion del juego, DLSS ni visor. 50% implica ~25% de pixeles.
; Aumentarla mejora la definicion del efecto y aumenta coste/VRAM.
ScalePercent=60

; Mezcla del cambio Neural: entero 0..100. Bajarla no evita evaluar el modelo.
; 0 elimina la contribucion visual, pero para ahorrar coste usar Enabled=0.
IntensityPercent=90

; Evaluaciones sucesivas: entero 1..4. Cada pasada mantiene su propio historial.
; Mas pasadas refuerzan el efecto y aumentan mucho el coste GPU y la latencia.
; Empezar por una cuando se combine con generacion de frames de Remleo.
Passes=1

; 1=transferir diferencia Neural al original completo, preservando detalle.
; 0=usar el resultado procesado reescalado. Recomendado 1 a escala reducida.
Residual=1

; Estilo local: 0=Equilibrado, 1=Nitido, 2=Cinematico. Entero 0..2.
; Son controles del modelo, no presets del DLSS SR del Layer.
Style=2

; Preset solicitado al modelo: entero 0..1. Puede no producir cambio visible
; con esta biblioteca. No equivale al preset K/J/L/M del reescalador.
Preset=0

; Fuerza de estructura local, real 0..1. Modula la conservacion de estructura.
LocalStructure=1

; Fuerza de tono local, real 0..1. Modula el tratamiento tonal del modelo.
LocalTone=1

; 1=piel automatica del modelo; 0=usar SkinStrength manual.
SkinAuto=1

; Fuerza manual de estructura de piel, real 0..1. Ignorada con SkinAuto=1.
SkinStrength=1

; 1=mascara automatica del modelo; 0=desactivada. No es una mascara HUD.
AutoMask=1

; Region central FIJA Neural por dimension, entero 20..100.
; 100=ojo entero; entonces forma/transicion/periferia no recortan la imagen.
; Es independiente del foveado de reconstruccion DLSS, no sigue la mirada.
FoveaPercent=100

; Forma central: entero 0=rectangulo, 1=elipse. Efectiva con FoveaPercent<100.
FoveaShape=1

; Anchura de transicion INTERIOR de la region central, real 0..4096 pixeles.
; Suaviza la union con periferia/original; no reduce el numero de evaluaciones.
FeatherPixels=400

; 1=procesar tambien periferia; 0=fuera de la region se conserva original.
; Relevante con FoveaPercent<100. Activarla aumenta trabajo GPU.
OuterEnabled=0

; Escala periferica por dimension, entero 10..100. Solo con OuterEnabled=1.
OuterScalePercent=25

; 1=empaquetar regiones; 0=evaluaciones separadas. Efectivo con periferia activa.
; No garantiza igual coste/calidad; comprobar uniones y coherencia binocular.
OuterPack=1

; 1=estimar vectores desde GIRO del visor asociado a la imagen; 0=vectores cero.
; No incluye enemigos, armas, traslacion ni movimiento real del motor.
MotionVectors=1

; Convencion del movimiento: entero SOLO -1 o +1. Mantener +1 inicialmente.
MotionSign=1

; Multiplicador del movimiento estimado, real 0..4. No corrige datos ausentes.
MotionScale=1

; Profundidad artificial uniforme, real 0..1. No es profundidad real de DOOM.
ConstantDepth=0.5

; Referencia interna del viewport, entero 25..100. No es render scale de DOOM.
; Mantener 100 para el contrato de ojos completos de esta version.
ViewportReferencePercent=100

; Proveedor: entero 0=automatico, 1=driver NGX, 2=DLL local.
; 2 corresponde al modelo privado probado; otros dependen del driver instalado.
Backend=2

; Identificador de inicializacion NGX, entero 0..4294967295.
; Mantener este valor de la integracion existente; cambiarlo puede impedir cargar.
AppId=608699473

; Fotogramas iniciales de diagnostico del procesador, entero 0..60.
; No guarda imagenes ni seguimiento persistente. Log acotado en TEMP/KHARVOX-
; Diagnostics/NeuralPost. El log KHARVOX identifica aplicacion antes de release.
LogFrames=3
